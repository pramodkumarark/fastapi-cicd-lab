name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  quality:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/checkout@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check .

      - name: Check formatting
        run: |
          ruff format --check .


  test:

    needs: quality

    runs-on: ubuntu-latest

    # strategy:
    #   matrix:
    #     python-version: ["3.11", "3.12", "3.13"]

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Build Docker image
        run: |
          docker build -t fastapi-cicd-lab:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fastapi-cicd-lab:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Run Docker container
        run: |
          docker run -d \
            --name fastapi-test \
            -p 8000:8000 \
            fastapi-cicd-lab:${{ github.sha }}

      - name: Test container
        run: |
          sleep 5
          curl --fail http://localhost:8000/health

      - name: Stop container
        if: always()
        run: |
          docker stop fastapi-test
          docker rm fastapi-test
